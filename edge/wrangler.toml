# Cloudflare Worker that adds Markdown content negotiation in front of GitHub Pages (see worker.mjs).
# Needs the www DNS record proxied through Cloudflare. Deploy from this folder: npx wrangler deploy
name = "hazwoperosha-us-edge"
main = "worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = false
routes = [{ pattern = "www.hazwoperosha.us/*", zone_name = "hazwoperosha.us" }]
